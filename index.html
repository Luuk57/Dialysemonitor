<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dialyse Log - Kiosk Dashboard</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">

  <!-- Firebase SDK's -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    body { overscroll-behavior: none; user-select: none; }
    #dimmer { position: fixed; inset: 0; background: black; pointer-events: none; opacity: 0; z-index: 9999; transition: opacity 0.3s; }
    .tab-pane { display: none; }
    .tab-pane.active { display: flex; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col overflow-hidden relative">

  <!-- Helderheid / Dimmer overlay -->
  <div id="dimmer"></div>

  <!-- ==================== VASTE BOBENBALK ==================== -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex justify-between items-center z-20 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-xl">🩺</span>
      <h1 class="font-bold tracking-wide text-sky-400 text-sm">Dialyse Kiosk</h1>
      <span id="syncStatus" class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-medium">Live Synced ⚡</span>
    </div>

    <!-- Live Aftelklok in de bovenbalk -->
    <div class="flex items-center gap-2 bg-slate-950 px-4 py-1 rounded-xl border border-slate-800">
      <span class="text-xs text-slate-400">⏱️ Restant:</span>
      <span id="topCountdown" class="font-extrabold text-sky-400 text-base tracking-wider">08:00:00</span>
    </div>
    
    <div class="flex items-center gap-3 text-sm">
      <div class="hidden md:flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-xl border border-slate-700 text-xs">
        <span>🌙 Dim:</span>
        <input type="range" id="brightnessRange" min="0" max="80" value="0" class="w-16 accent-sky-400 cursor-pointer">
      </div>
      <button id="fullscreenBtn" class="bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer">⛶ Full</button>
      <button id="lockBtn" class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer">🔒 Slot</button>
    </div>
  </header>

  <!-- ==================== MAIN PAGINA INHOUD (TABBLADEN) ==================== -->
  <main class="flex-1 p-4 overflow-y-auto relative flex flex-col items-center">
    
    <!-- TAB 1: GEWICHT & HISTORIE -->
    <div id="tab-gewicht" class="tab-pane active flex-col gap-4 w-full max-w-2xl mx-auto pb-6">
      
      <!-- Instelling & Invoer Kaart -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col gap-4">
        <h2 class="text-sky-400 font-bold text-base border-b border-slate-800 pb-2">⚖️ Gewicht & UF (in ml)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Vaste Drooggewicht (kg)</label>
            <input type="number" step="0.1" id
